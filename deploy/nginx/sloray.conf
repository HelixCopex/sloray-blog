# 放入 /etc/nginx/sites-available/sloray，再从 sites-enabled 链接。
# 在 http 上下文加载；替换域名和证书路径后 nginx -t 再 reload。
upstream sloray_api {
    zone sloray_api 64k;
    server 127.0.0.1:8080 max_fails=1 fail_timeout=5s;
    server 127.0.0.1:8081 max_fails=1 fail_timeout=5s;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name blog.example.com;
    return 308 https://blog.example.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name blog.example.com;
    ssl_certificate /etc/letsencrypt/live/blog.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/blog.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    client_max_body_size 2m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=86400" always;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 2s;
    proxy_read_timeout 30s;
    proxy_cache off;

    location ~ ^/(api(?:/|$)|healthz$|readyz$|setup$|login$|logout$|admin/settings$) {
        proxy_pass http://sloray_api;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
    }

    # Astro 为实际资源设置 immutable；404 保留 no-store，不缓存不存在的资源。
    location /_astro/ {
        proxy_pass http://127.0.0.1:4321;
    }

    location / {
        proxy_pass http://127.0.0.1:4321;
    }
}
