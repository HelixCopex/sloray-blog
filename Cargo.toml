[package]
name = "sloray"
description = "sloray-blog 单一二进制：serve / migrate / systemd / setup-token"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# 整个项目只产出这一个可执行文件，所以 `cargo install --path .` 就够了：
#   cargo install --path . --root /usr/local
[[bin]]
name = "sloray"
path = "src/main.rs"

[dependencies]
# 按功能分立的 crate。依赖方向是单向的：
#   config ← store ← auth ← setup ← web
# web 是唯一依赖全部业务 crate 的地方，也是唯一知道 HTTP 的地方。
sloray-config.workspace = true
sloray-store.workspace = true
sloray-auth.workspace = true
sloray-setup.workspace = true
sloray-web.workspace = true
sloray-migration.workspace = true
sloray-content.workspace = true
sloray-media.workspace = true

anyhow.workspace = true
clap.workspace = true
tokio.workspace = true
tracing.workspace = true
sea-orm.workspace = true
dotenvy.workspace = true
serde_json.workspace = true

[lints]
workspace = true

[workspace]
resolver = "3"
members = [
    "crates/config",
    "crates/store",
    "crates/auth",
    "crates/setup",
    "crates/web",
    "crates/content",
    "crates/media",
    "crates/migration",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
# MSRV: sea-orm 2.0.4 declares rust-version = "1.94.0"。
rust-version = "1.94.1"
license = "MIT"
publish = false

[workspace.dependencies]
# 内部 crate（path 依赖）。
# 刻意带 `version`：不只是为了将来能发布，更是因为 cargo-deny 的
# wildcard 规则会把"只有 path 没有 version"视为无约束依赖（`cargo deny check bans`）。
# 它们必须与 [workspace.package].version 保持一致。
sloray-config = { path = "crates/config", version = "0.1.0" }
sloray-store = { path = "crates/store", version = "0.1.0" }
sloray-auth = { path = "crates/auth", version = "0.1.0" }
sloray-setup = { path = "crates/setup", version = "0.1.0" }
sloray-content = { path = "crates/content", version = "0.1.0" }
sloray-media = { path = "crates/media", version = "0.1.0" }
sloray-web = { path = "crates/web", version = "0.1.0" }
sloray-migration = { path = "crates/migration", version = "0.1.0" }

anyhow = "1.0.104"
axum = { version = "0.8.9", features = ["macros", "tracing"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
dotenvy = "0.15.7"
figment = { version = "0.10.19", features = ["toml", "env", "json"] }
http-body-util = "0.1.3"
sea-orm = { version = "2.0.4", default-features = false, features = [
    "runtime-tokio-rustls",
    "sqlx-postgres",
    "macros",
    "with-uuid",
    "with-chrono",
    "with-json",
    "tracing-spans",
] }
sea-orm-migration = { version = "2.0.4", default-features = false, features = [
    "runtime-tokio-rustls",
    "sqlx-postgres",
] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
# 会话过期时间要在应用层判断（不依赖数据库时钟），所以需要构造时间戳。
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std", "serde"] }
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "signal", "net", "time", "fs"] }
tower = "0.5.3"
tower-http = { version = "0.7.1", features = [
    "trace",
    "request-id",
    "compression-gzip",
    "catch-panic",
] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json", "fmt"] }
# token 用 uuid v4 生成（底层是 getrandom），不额外引入 rand：
# 2 个 v4 UUID = 244 位熵，足够做一次性 setup token 和会话 token。
uuid = { version = "1.27.0", features = ["v7", "v4", "serde"] }
argon2 = { version = "0.6.0", default-features = false, features = ["alloc", "getrandom", "password-hash"] }
sha2 = "0.11.0"
hex = "0.4.3"
subtle = "2.6.1"
url = "2.5.8"
utoipa = { version = "5.4.0", features = ["chrono", "uuid"] }
jieba-rs = "0.11.0"
aws-sdk-s3 = { version = "=1.152.0", default-features = false, features = ["rt-tokio", "default-https-client", "behavior-version-latest"] }
image = { version = "0.25.9", default-features = false, features = ["png", "jpeg", "webp"] }
base64 = "0.22.1"
reqwest = { version = "0.13.2", default-features = false, features = ["rustls", "json"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"

# 单台 VPS 原生部署：release 直接产出可跑的二进制，去掉调试符号减小体积。
[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

# debug 信息降到行号级别，显著降低内存与磁盘占用（编译期最主要的两个瓶颈）。
[profile.dev]
debug = 1
