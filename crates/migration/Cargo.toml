[package]
name = "sloray-migration"
description = "sloray-blog 数据库迁移：以库形式提供，由 sloray 二进制的 migrate 子命令驱动"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# 不再单独产出二进制：CLI 统一收敛到仓库根目录的 `sloray`（cargo install 只装一次）。
[lib]
name = "sloray_migration"
path = "src/lib.rs"

[dependencies]
anyhow.workspace = true
sea-orm.workspace = true
sea-orm-migration.workspace = true

[lints]
workspace = true
